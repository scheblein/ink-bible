name: Compile Release

# Build and attach firmware when a release is published manually, or auto-create
# and publish a release (tagged from platformio.ini without a 'v' prefix) when
# a PR is merged to master with a new version.

on:
  release:
    types: [published]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.meta.outputs.should_build }}
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ steps.meta.outputs.ref }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      create_release: ${{ steps.meta.outputs.create_release }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$EVENT_TAG" >> "$GITHUB_OUTPUT"
            echo "ref=$EVENT_TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=${EVENT_PRERELEASE:-false}" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(sed -n 's/^version = //p' platformio.ini | head -n1)"
          if [ -z "$version" ]; then
            echo "Could not read version from platformio.ini" >&2
            exit 1
          fi

          release_exists() {
            local tag="$1"
            local status
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
            if [ "$status" = "200" ]; then
              return 0
            elif [ "$status" = "404" ]; then
              return 1
            else
              echo "Unexpected GitHub API status ($status) checking release '$tag'" >&2
              exit 1
            fi
          }

          if release_exists "$version" || release_exists "v${version}"; then
            echo "Release for version $version already exists; skipping auto-release."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Guard against a pre-existing git tag pointing at a different commit
          # (gh release create ignores --target when the tag already exists).
          tag_refs="$(git ls-remote --tags origin "refs/tags/${version}" "refs/tags/${version}^{}")"
          if [ -n "$tag_refs" ]; then
            tag_sha="$(printf '%s\n' "$tag_refs" | awk '/\^\{\}$/ {peeled=$1} !/\^\{\}$/ {direct=$1} END {print (peeled ? peeled : direct)}')"
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Tag '$version' already exists at $tag_sha (expected $GITHUB_SHA); refusing to publish mismatched assets." >&2
              exit 1
            fi
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          echo "create_release=true" >> "$GITHUB_OUTPUT"

  build-release:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_env: gh_release
            rc_env: gh_release_rc
            device: x3-x4
          - release_env: x4pro-gh_release
            rc_env: x4pro-gh_release_rc
            device: x4pro
          - release_env: x4c-gh_release
            rc_env: x4c-gh_release_rc
            device: x4c
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          version="${RELEASE_TAG#v}"
          configured_version="$(sed -n 's/^version = //p' platformio.ini | head -n1)"
          if [ "$IS_PRERELEASE" = "true" ]; then
            test "$version" = "${configured_version}rc"
          else
            test "$version" = "$configured_version"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U "pioarduino==6.1.19"
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside the platform penv
        env:
          PIO_ENV: ${{ needs.prepare.outputs.prerelease == 'true' && matrix.rc_env || matrix.release_env }}
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig run a nested `pio run` from
          # ~/.platformio/penv. Keep that core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build CrossPoint
        env:
          PIO_ENV: ${{ needs.prepare.outputs.prerelease == 'true' && matrix.rc_env || matrix.release_env }}
          # Enrollment gate for the LCP service: official releases carry this
          # key, self-builds do not (and lose only LCP). Rotate per release by
          # updating the repo secret; retire old values in the service's
          # RELEASE_KEYS list.
          FREEINK_LCP_RELEASE_KEY: ${{ secrets.FREEINK_LCP_RELEASE_KEY }}
        run: |
          if [ -n "$FREEINK_LCP_RELEASE_KEY" ]; then
            export PLATFORMIO_BUILD_FLAGS="-DFREEINK_LCP_RELEASE_KEY=\\\"$FREEINK_LCP_RELEASE_KEY\\\""
          fi
          CROSSPOINT_RC_HASH="$(git rev-parse --short=7 HEAD)" pio run -e "$PIO_ENV" -j1

      - name: Prepare firmware asset
        id: asset
        env:
          PIO_ENV: ${{ needs.prepare.outputs.prerelease == 'true' && matrix.rc_env || matrix.release_env }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          asset="ink-bible-${version}-${{ matrix.device }}.bin"
          cp ".pio/build/${PIO_ENV}/firmware.bin" "$asset"
          echo "name=$asset" >> "$GITHUB_OUTPUT"

      - name: Stage firmware asset
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.asset.outputs.name }}
          path: ${{ steps.asset.outputs.name }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-release:
    needs: [prepare, build-release]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ink-bible-*.bin
          merge-multiple: true

      - name: Publish or attach firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REF: ${{ needs.prepare.outputs.ref }}
          CREATE_RELEASE: ${{ needs.prepare.outputs.create_release }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for device in x3-x4 x4pro x4c; do
            test -f "dist/ink-bible-${version}-${device}.bin"
          done
          test "$(find dist -maxdepth 1 -type f -name 'ink-bible-*.bin' | wc -l)" -eq 3
          if [ "$CREATE_RELEASE" = "true" ]; then
            gh release create "$RELEASE_TAG" dist/ink-bible-*.bin \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_REF" \
              --title "$RELEASE_TAG" \
              --generate-notes
          else
            gh release upload "$RELEASE_TAG" dist/ink-bible-*.bin \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
